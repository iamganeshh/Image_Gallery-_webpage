<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Responsive Image Gallery</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #333;
    }

    /* Header */
    .header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 60px 20px;
    }

    .header h1 {
      font-size: 50px;
      margin-bottom: 15px;
    }

    .header p {
      font-size: 18px;
      color: #d1d5db;
    }

    /* Gallery Section */
    .gallery-section {
      padding: 80px 8%;
    }

    .gallery-grid {
      display: grid;

      /* 3 columns on desktop */
      grid-template-columns: repeat(3, 1fr);

      gap: 25px;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      cursor: pointer;
      background: white;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      transition: 0.4s;
    }

    .gallery-item:hover {
      transform: translateY(-10px);
    }

    .gallery-item img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      transition: 0.5s;
      display: block;
    }

    .gallery-item:hover img {
      transform: scale(1.08);
    }

    /* Overlay */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(17, 24, 39, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: 0.4s;
    }

    .gallery-item:hover .overlay {
      opacity: 1;
    }

    .overlay i {
      color: white;
      font-size: 40px;
    }

    /* Footer */
    footer {
      background: #111827;
      color: white;
      text-align: center;
      padding: 30px 20px;
      margin-top: 50px;
    }

    footer p {
      margin-bottom: 15px;
    }

    footer a {
      color: white;
      margin: 0 10px;
      font-size: 22px;
      transition: 0.3s;
    }

    footer a:hover {
      color: #60a5fa;
    }

    /* Tablet */
    @media(max-width:992px) {

      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
      }

    }

    /* Mobile */
    @media(max-width:768px) {

      .header h1 {
        font-size: 38px;
      }

      .header p {
        font-size: 16px;
      }

      /* 1 column on mobile */
      .gallery-grid {
        grid-template-columns: 1fr;
      }

      .gallery-item img {
        height: 250px;
      }

    }
  </style>

</head>

<body>

  <!-- Header -->
  <section class="header">

    <h1>Nature Image Gallery</h1>

    <p>
      Responsive gallery using CSS Grid Layout
    </p>

  </section>

  <!-- Gallery -->
  <section class="gallery-section">

    <div class="gallery-grid">

      <!-- Image 1 -->
      <div class="gallery-item">

        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1200"
          alt="Nature">

        <div class="overlay">

          <i class="bi bi-image-fill"></i>

        </div>

      </div>

      <!-- Image 2 -->
      <div class="gallery-item">

        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=1200"
          alt="Mountain">

        <div class="overlay">

          <i class="bi bi-camera-fill"></i>

        </div>

      </div>

      <!-- Image 3 -->
      <div class="gallery-item">

        <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?q=80&w=1200"
          alt="Forest">

        <div class="overlay">

          <i class="bi bi-image-fill"></i>

        </div>

      </div>

      <!-- Image 4 -->
      <div class="gallery-item">

        <img src="https://images.unsplash.com/photo-1511884642898-4c92249e20b6?q=80&w=1200"
          alt="Beach">

        <div class="overlay">

          <i class="bi bi-camera-fill"></i>

        </div>

      </div>

      <!-- Image 5 -->
      <div class="gallery-item">

        <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?q=80&w=1200"
          alt="Waterfall">

        <div class="overlay">

          <i class="bi bi-image-fill"></i>

        </div>

      </div>

      <!-- Image 6 -->
      <div class="gallery-item">

        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1200"
          alt="Ocean">

        <div class="overlay">

          <i class="bi bi-camera-fill"></i>

        </div>

      </div>

    </div>

  </section>

  <!-- Footer -->
  <footer>

    <p>
      © 2026 Responsive Image Gallery
    </p>

    <div>

      <a href="#">
        <i class="bi bi-facebook"></i>
      </a>

      <a href="#">
        <i class="bi bi-instagram"></i>
      </a>

      <a href="#">
        <i class="bi bi-twitter-x"></i>
      </a>

      <a href="#">
        <i class="bi bi-youtube"></i>
      </a>

    </div>

  </footer>

</body>

</html>
